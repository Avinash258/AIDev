name: AI Code Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run AI Code Review report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          FAIL_ON_CRITICAL: '0'
        run: |
          mkdir -p reports
          node scripts/ai-code-review-report.mjs | tee reports/ai-code-review-console.log

      - name: Write job summary
        if: always()
        run: |
          if [ -f reports/ai-code-review.md ]; then
            cat reports/ai-code-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## AI Code Review" >> "$GITHUB_STEP_SUMMARY"
            echo "Report file was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review-report
          path: |
            reports/ai-code-review.md
            reports/ai-code-review.txt
            reports/ai-code-review-console.log
          retention-days: 30
          if-no-files-found: warn

      - name: Comment report on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/ai-code-review.md';
            if (!fs.existsSync(path)) {
              core.warning('No review report found to comment');
              return;
            }
            let body = fs.readFileSync(path, 'utf8');
            // Keep PR comments reasonably sized
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n_(truncated — full report is in the workflow artifact)_';
            }
            const marker = '<!-- ai-code-review-report -->';
            const commentBody = `${marker}\n## AI Code Review Report\n\n${body}\n\n---\n_Artifact: **ai-code-review-report** on this workflow run._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }
